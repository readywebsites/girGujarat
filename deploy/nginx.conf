# ==============================================================================
# NGINX SITE CONFIGURATION: TRAVEL FIRST HOLIDAYS (girGujarat)
# Dedicated site configuration file: /etc/nginx/sites-available/girgujarat.conf
# ==============================================================================
# NOTE FOR MULTI-SITE VPS:
# - Do NOT replace existing sites or the default file.
# - This block routes requests matching IP 157.173.218.111 (or your future domain)
#   specifically to the girGujarat application.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;

    # Matches requests to the VPS public IP (add domain names here when DNS is ready)
    server_name 157.173.218.111;

    # Maximum payload size for inquiries and bookings
    client_max_body_size 10M;

    # Security headers (non-intrusive, isolated to this server block)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Django collected static files (Admin, DRF browsable API, etc.)
    location /static/ {
        alias /srv/girgujarat/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Frontend CSS assets
    location /css/ {
        alias /srv/girgujarat/css/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Frontend JavaScript assets
    location /js/ {
        alias /srv/girgujarat/js/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Frontend media, icons, and image assets
    location /assets/ {
        alias /srv/girgujarat/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Favicon fallback
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Reverse proxy to Gunicorn Unix domain socket
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_pass http://unix:/run/girgujarat/gunicorn.sock;
    }
}
